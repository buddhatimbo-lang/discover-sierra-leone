<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Discover Sierra Leone</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>

            </ul>
        </nav>
    </header>

    <section class="contact-content">
        <h1>Contact Us</h1>

        <div class="contact-wrapper">
            <form class="contact-form">
                <label>Name</label>
                <input type="text" placeholder="Your name">

                <label>Email</label>
                <input type="email" placeholder="Your email">

                <label>Message</label>
                <textarea placeholder="Your message"></textarea>

                <button type="submit">Submit</button>
            </form>

            <div class="contact-map">
                <iframe Src=https://www.google.com/maps?q=Freetown,+Sierra+Leone&output=embed Width="100%" Height="300"
                    Style="border:0;" Allowfullscreen="" Loading="lazy">
                </iframe>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-left">&copy; 2026 Discover Sierra Leone</div>
        <ul class="footer-links">
            <li><a href="index.html">Home</a></li>

            <li><a href="explore.html">Explore</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="footer-social">
            <a href=https://facebook.com target=”_blank”>FB</a>
            <a href=https://instagram.com target=”_blank”>IG</a>
            <a href=https://twitter.com target=”_blank”>TW</a>

        </div>
